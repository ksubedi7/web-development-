<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Football Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Oswald:wght@500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <div class="logo">FOOTBALL<span>HUB</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="game.html">Game</a></li>
                <li><a href="topics.html">Topics</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-container">
        <section>
            <h2>Get In Touch</h2>
            <div class="form-container">
                <form id="contact-form" novalidate>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Lionel Messi">
                        <div class="error-msg" id="name-error">Please enter your name.</div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="lm10@example.com">
                        <div class="error-msg" id="email-error">Please enter a valid email address.</div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Your message here..."></textarea>
                        <div class="error-msg" id="message-error">Please enter a message.</div>
                    </div>

                    <div class="form-group">
                        <div id="success-message"
                            style="display: none; padding: 15px; margin-bottom: 20px; background: rgba(46, 204, 113, 0.2); color: #2ecc71; border-radius: 8px; border: 1px solid #2ecc71; font-weight: 600;">
                            Message sent successfully!</div>
                    </div>

                    <button type="submit" class="submit-btn" id="submit-form-btn">Send Message</button>
                </form>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Football Hub. Created by Kashyap, Laxman, and Dibya.</p>
    </footer>

    <script src="contact.js"></script>
</body>

</html>
